name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Test (race)
        run: go test -race ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t rail-timetable-mcp-uk:ci .
      - name: Refuses to start publicly without a token
        run: |
          if docker run --rm rail-timetable-mcp-uk:ci; then
            echo "expected the container to refuse to start without MCP_AUTH_TOKEN" >&2
            exit 1
          fi
